<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexusCollab — Real-Time Collaborative Workspace & Communication</title>
  <meta name="description" content="State-of-the-art real-time collaboration workspace with simultaneous document editing, operational sync, live cursor tracking, multi-channel team chat, and clean architecture.">
  
  <!-- Modern Typography (Plus Jakarta Sans & JetBrains Mono) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Master Application Styles -->
  <link rel="stylesheet" href="/css/main.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
</head>
<body>
  <div id="app">
    <!-- Top Workspace Header -->
    <header class="app-header">
      <div class="header-left">
        <a href="#" class="brand-logo" title="NexusCollab Workspace">
          <div class="brand-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
              <polyline points="2 17 12 22 22 17"></polyline>
              <polyline points="2 12 12 17 22 12"></polyline>
            </svg>
          </div>
          <span>NexusCollab</span>
        </a>

        <!-- Live Sync Status Indicator -->
        <div id="header-sync-status" class="sync-status-badge">
          <span class="sync-dot"></span>
          <span>Live</span>
        </div>
      </div>

      <div class="header-center">
        <div class="active-doc-badge">
          <span style="font-size: 14px;">📝</span>
          <span id="header-active-doc">Loading Workspace...</span>
        </div>
      </div>

      <div class="header-right">
        <!-- Collaborators Stack -->
        <div id="header-avatar-stack" class="collaborator-stack" title="Active collaborators online"></div>

        <!-- Multi-tab simulation persona clone button -->
        <button id="header-clone-tab" class="btn-sim-clone" title="Open a new collaborative session in another window to test real-time sync">
          <span>👥</span>
          <span>Clone Persona</span>
        </button>

        <!-- Web Audio Chimes Toggle -->
        <button id="header-sound-toggle" class="btn-icon-action active" title="Toggle audio feedback chimes">
          🔔
        </button>

        <!-- Chat Panel Toggle Button -->
        <button id="header-chat-toggle" class="btn-icon-action active" title="Toggle team chat sidebar">
          💬
        </button>

        <!-- Current User Profile Avatar & Status Pill -->
        <button id="header-profile-btn" class="user-identity-btn" title="Customize display name and status">
          <div class="user-avatar-self" style="background-color: #6366f1;">U</div>
          <span class="user-name-self">You</span>
          <span class="status-indicator-self status-active"></span>
        </button>
      </div>
    </header>

    <!-- Main Workspace Shell -->
    <div class="app-body">
      <!-- Left Sidebar (Documents, Channels, Team) -->
      <aside class="app-sidebar">
        <!-- Sidebar Navigation Tabs -->
        <div class="sidebar-nav-tabs">
          <button id="tab-btn-docs" class="sidebar-tab-btn active">Docs</button>
          <button id="tab-btn-channels" class="sidebar-tab-btn">Channels</button>
          <button id="tab-btn-team" class="sidebar-tab-btn">Team</button>
        </div>

        <!-- Sidebar Content: Documents Tab -->
        <div id="sidebar-docs-content" class="sidebar-content">
          <div class="sidebar-section">
            <div class="sidebar-section-header">
              <span class="sidebar-section-label">Shared Documents</span>
              <button id="btn-new-doc" class="btn-section-add" title="Create new document">+</button>
            </div>
            <div id="sidebar-docs-list"></div>
          </div>
        </div>

        <!-- Sidebar Content: Channels Tab -->
        <div id="sidebar-channels-content" class="sidebar-content" style="display: none;">
          <div class="sidebar-section">
            <div class="sidebar-section-header">
              <span class="sidebar-section-label">Discussion Rooms</span>
              <button id="btn-new-channel" class="btn-section-add" title="Create new discussion channel">+</button>
            </div>
            <div id="sidebar-channels-list"></div>
          </div>
        </div>

        <!-- Sidebar Content: Team Presence Tab -->
        <div id="sidebar-team-content" class="sidebar-content" style="display: none;">
          <div class="sidebar-section">
            <div class="sidebar-section-header">
              <span class="sidebar-section-label">Online Collaborators</span>
            </div>
            <div id="sidebar-team-list"></div>
          </div>
        </div>

        <!-- Sidebar Footer -->
        <div class="sidebar-footer">
          <div class="workspace-status">
            <span class="sync-dot"></span>
            <span id="sidebar-online-count">1 Online</span>
          </div>
          <span style="font-size: 11px; color: var(--text-muted);">WebSocket v2</span>
        </div>
      </aside>

      <!-- Center Collaborative Editor Area -->
      <main class="app-center">
        <div class="editor-container">
          <!-- Document Top Toolbar -->
          <div class="editor-toolbar">
            <div class="toolbar-left">
              <input type="text" id="editor-doc-title" class="doc-title-input" value="Untitled Document" spellcheck="false" title="Document title" readonly />
              <span id="editor-version-pill" class="doc-version-pill">v1</span>
            </div>

            <!-- View Mode Switcher -->
            <div class="toolbar-center">
              <button id="btn-mode-edit" class="view-mode-btn" title="Editor Only">Edit</button>
              <button id="btn-mode-split" class="view-mode-btn active" title="Split Editor & Markdown Preview">Split</button>
              <button id="btn-mode-preview" class="view-mode-btn" title="Rendered Preview">Preview</button>
            </div>

            <!-- Actions Right -->
            <div class="toolbar-right">
              <button id="btn-create-checkpoint" class="btn-toolbar-action" title="Save a version milestone in document history">
                <span>🔖</span>
                <span>Checkpoint</span>
              </button>
              <button id="btn-view-history" class="btn-toolbar-action" title="Inspect version checkpoints and rollback">
                <span>🕰️</span>
                <span>History</span>
              </button>
              <button id="btn-export-doc" class="btn-toolbar-action primary" title="Export document as Markdown file">
                <span>⬇️</span>
                <span>Export</span>
              </button>
            </div>
          </div>

          <!-- Dual Workspace Body -->
          <div class="editor-workspace">
            <div id="editor-pane" class="editor-pane">
              <!-- Line numbers column -->
              <div id="editor-line-numbers" class="editor-line-numbers">1</div>
              <!-- Textarea editor -->
              <textarea id="editor-textarea" class="editor-textarea" placeholder="Start typing here to collaborate in real-time..." spellcheck="false"></textarea>
            </div>

            <!-- Live Markdown Preview -->
            <div id="preview-pane" class="preview-pane"></div>
          </div>

          <!-- Editor Status Bar -->
          <div class="editor-status-bar">
            <div class="status-bar-left">
              <span id="status-cursor-pos">Ln 1, Col 1</span>
              <span id="status-counts">0 words, 0 chars</span>
            </div>
            <div class="status-bar-right">
              <span id="status-doc-version">Version 1</span>
              <span id="status-doc-author">Nexus Engine</span>
            </div>
          </div>
        </div>
      </main>

      <!-- Right Collapsible Chat Panel -->
      <aside class="app-chat-panel">
        <div class="chat-container">
          <!-- Chat Channel Header -->
          <div class="chat-header">
            <div class="chat-header-info">
              <span id="chat-active-channel-name" class="chat-channel-name">#general</span>
              <span id="chat-active-channel-topic" class="chat-channel-topic">Team announcements and discussion</span>
            </div>
          </div>

          <!-- Live Message Stream -->
          <div id="chat-messages-stream" class="chat-messages"></div>

          <!-- Typing Indicator Bubble -->
          <div id="chat-typing-container" class="chat-typing-container" style="visibility: hidden;">
            <div class="typing-dots">
              <div class="typing-dot"></div>
              <div class="typing-dot"></div>
              <div class="typing-dot"></div>
            </div>
            <span id="chat-typing-text">Someone is typing...</span>
          </div>

          <!-- Message Composer -->
          <div class="chat-composer">
            <div class="composer-box">
              <textarea id="chat-composer-input" class="chat-input" placeholder="Message #general... (Enter to send, Shift+Enter for newline)" rows="1"></textarea>
              <div class="composer-actions">
                <div class="composer-toolbar">
                  <button id="btn-tool-bold" class="btn-composer-tool" title="Bold text"><strong>B</strong></button>
                  <button id="btn-tool-code" class="btn-composer-tool" title="Inline code">&lt;/&gt;</button>
                </div>
                <button id="btn-chat-send" class="btn-chat-send" title="Send message">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                  </svg>
                </button>
              </div>
            </div>
          </div>
        </div>
      </aside>
    </div>

    <!-- Workspace Screen Pointer Radar Overlay -->
    <div id="cursor-radar-container"></div>

    <!-- Modals Container -->
    <div id="modal-overlay" class="modal-overlay">
      <div id="modal-container"></div>
    </div>

    <!-- Floating Toast Container -->
    <div id="toast-container"></div>
  </div>

  <!-- Socket.IO Client Library (served automatically by Socket.io engine) -->
  <script src="/socket.io/socket.io.js"></script>

  <!-- Application Bootstrap -->
  <script type="module" src="/js/app.js"></script>
</body>
</html>
